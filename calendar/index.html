<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026年度 勤務カレンダー</title>
<meta name="description" content="職場の2026年度カレンダー。今日が出勤か休みか、次の休みや連休をすぐ確認できます。">
<meta name="theme-color" content="#d23a4c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勤務カレンダー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, phone first — today's status on top, then month grid, then lists. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1d2333; --muted:#6b7183; --line:#e1e4ea;
  --off:#d23a4c; --off-bg:#fdecee; --paid:#f3b6be; --paid-ink:#8e1f2e;
  --work:#2d6a4f; --work-bg:#e6f2ec; --accent:#1f3a8a; --ring:#1d2333;
  --font-jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --font-num:"Outfit","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1b1f29; --ink:#e9ebf1; --muted:#9aa0b1; --line:#2c3240;
  --off:#ff6b7b; --off-bg:#3a1d24; --paid:#7a2f3b; --paid-ink:#ffd5da;
  --work:#6fcf9f; --work-bg:#17312a; --accent:#8fa8ff; --ring:#e9ebf1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f29; --ink:#e9ebf1; --muted:#9aa0b1; --line:#2c3240;
  --off:#ff6b7b; --off-bg:#3a1d24; --paid:#7a2f3b; --paid-ink:#ffd5da;
  --work:#6fcf9f; --work-bg:#17312a; --accent:#8fa8ff; --ring:#e9ebf1; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-jp);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{font-size:1.15rem;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.82rem}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:.95rem;margin:0 0 10px;font-weight:700}

/* Today */
.today{display:flex;flex-direction:column;gap:12px}
.today-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.today-label{font-size:.78rem;color:var(--muted);letter-spacing:.08em}
.today-date{font-size:1.7rem;font-weight:700;line-height:1.2}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-weight:900;font-size:1.05rem;white-space:nowrap}
.pill.work{background:var(--work-bg);color:var(--work)}
.pill.off{background:var(--off-bg);color:var(--off)}
.pill.paid{background:var(--paid);color:var(--paid-ink)}
.pill.hw{background:var(--work-bg);color:var(--work);box-shadow:inset 0 0 0 2px var(--work)}
.note{font-size:.85rem;color:var(--muted)}
.next{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next > div{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.next .k{font-size:.75rem;color:var(--muted)}
.next .v{font-weight:700}
.next .s{font-size:.8rem;color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:8px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}

/* Month */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mtitle{text-align:center}
.mtitle b{font-size:1.4rem;font-family:var(--font-num)}
.mtitle > span{display:block;font-size:.78rem;color:var(--muted)}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr) 28px;gap:4px;touch-action:pan-y}
.dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:700;padding-bottom:2px}
.dow.sun,.dow.sat{color:var(--off)}
.wk{display:flex;align-items:center;justify-content:center;font-size:.68rem;color:var(--muted)}
.wk i{font-style:normal;border:1px solid var(--line);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.day{aspect-ratio:1/1;max-width:100%;border:0;border-radius:9px;background:transparent;color:var(--ink);font-family:var(--font-num);font-size:1.05rem;font-weight:500;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.day.off{color:var(--off);background:var(--off-bg);font-weight:600}
.day.paid{background:var(--paid);color:var(--paid-ink);font-weight:700}
.day.hw{box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.day.today::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.day.sel{outline:2.5px solid var(--accent);outline-offset:1px}
.day:focus-visible{outline:2.5px solid var(--accent);outline-offset:1px}
.day.empty{cursor:default}
.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:58px}
.detail .d{font-weight:700;font-size:1.05rem}
.detail .n{font-size:.82rem;color:var(--muted)}
.detail .pill{font-size:.9rem;padding:4px 12px}

/* Year */
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.year{grid-template-columns:repeat(2,1fr)}}
.mini{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-width:0}
.mini:hover{border-color:var(--muted)}
.mini .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.mini .h b{font-family:var(--font-num);font-size:1.05rem}
.mini .h span{font-size:.68rem;color:var(--muted)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mg i{font-style:normal;font-family:var(--font-num);font-size:.62rem;text-align:center;line-height:1.7;border-radius:3px}
.mg i.off{color:var(--off);background:var(--off-bg)}
.mg i.paid{background:var(--paid);color:var(--paid-ink)}
.mg i.hw{box-shadow:inset 0 0 0 1px var(--ink)}
.mg i.today{background:var(--accent);color:var(--surface)}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li.past{opacity:.45}
.list .t{font-weight:700}
.list .sub{font-size:.78rem;color:var(--muted)}
.badge{font-family:var(--font-num);font-weight:700;font-size:.85rem;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--off-bg);color:var(--off)}
.badge.big{background:var(--off);color:var(--surface)}
.badge.w{background:var(--work-bg);color:var(--work)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:.82rem}
.legend span{display:flex;align-items:center;gap:8px}
.sw{font-style:normal;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:.72rem;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--font-num);font-size:1.5rem}
.stats span{font-size:.75rem;color:var(--muted)}
footer{font-size:.75rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.grid.slide{animation:sl .18s ease-out}@keyframes sl{from{opacity:.4;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.install{background:var(--surface);border:1px dashed var(--off);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.install strong{color:var(--off)}
.install ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.install .actions{display:flex;gap:8px;flex-wrap:wrap}
.install button{font:inherit;font-weight:700;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.install button.primary{background:var(--off);color:#fff;border-color:var(--off)}
.install button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2026年度 勤務カレンダー</h1>
    <p>2026年4月〜2027年3月 ・ 会社カレンダーより</p>
  </header>

  <section class="panel today" id="today"></section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-month" aria-selected="true">月表示</button>
    <button role="tab" id="tab-year" aria-selected="false">年間</button>
    <button role="tab" id="tab-list" aria-selected="false">連休・出勤日</button>
  </div>

  <section class="panel" id="view-month">
    <div class="mhead">
      <button class="nav" id="prev" aria-label="前の月">‹</button>
      <div class="mtitle" id="mtitle"></div>
      <button class="nav" id="next" aria-label="次の月">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="panel" id="view-year" hidden>
    <h2>年間カレンダー</h2>
    <div class="year" id="year"></div>
  </section>

  <div id="view-list" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="panel"><h2>連休（3日以上）</h2><ul class="list" id="streaks"></ul></section>
    <section class="panel"><h2>祝日・出勤日</h2><p class="note" style="margin:0 0 6px">カレンダーで□印の日。祝日ですが出勤です。</p><ul class="list" id="hwork"></ul></section>
    <section class="panel"><h2>年間の合計</h2><div class="stats" id="stats"></div></section>
  </div>

  <section class="panel">
    <h2>見かた</h2>
    <div class="legend">
      <span><i class="sw" style="background:var(--off-bg);color:var(--off)">日</i>休日</span>
      <span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--ink)">出</i>祝日・出勤日</span>
      <span><i class="sw" style="background:var(--paid);color:var(--paid-ink)">有</i>一斉有休取得日（休み）</span>
      <span><i class="sw" style="border:1px solid var(--line);border-radius:50%;font-size:.65rem">48</i>週番号</span>
    </div>
  </section>

  <section class="install" id="install" hidden>
    <strong>ホーム画面に追加すると、アプリのようにすぐ開けます</strong>
    <div id="install-steps"></div>
    <div class="actions">
      <button type="button" class="primary" id="install-btn" hidden>ホーム画面に追加</button>
      <button type="button" id="install-close">閉じる</button>
    </div>
  </section>

  <footer>日付をタップすると詳細が出ます。月表示は左右スワイプでも切り替えできます。</footer>
</div>

<script>
(function(){
// ===== Calendar data (transcribed from the printed card) =====
const OFF = {
  "2026-04":[4,5,11,12,18,19,25,26],
  "2026-05":[2,3,4,5,6,7,8,9,10,16,17,23,24,30,31],
  "2026-06":[6,7,13,14,20,21,27,28],
  "2026-07":[4,5,11,12,18,19,20,25,26],
  "2026-08":[1,2,8,9,10,11,12,13,14,15,16,22,23,29,30],
  "2026-09":[5,6,12,13,19,20,21,26,27],
  "2026-10":[3,4,10,11,12,17,18,24,25,31],
  "2026-11":[1,7,8,14,15,21,22,23,28,29],
  "2026-12":[5,6,12,13,19,20,26,27,30,31],
  "2027-01":[1,2,3,9,10,11,16,17,23,24,30,31],
  "2027-02":[6,7,13,14,20,21,27,28],
  "2027-03":[6,7,13,14,20,21,22,27,28]
};
const PAID = new Set(["2026-12-28","2026-12-29"]);
const HOLIDAY_WORK = new Set(["2026-04-29","2026-09-22","2026-09-23","2026-11-03","2027-02-11","2027-02-23"]);
const HOLIDAYS = {
  "2026-04-29":"昭和の日","2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日","2026-05-06":"振替休日",
  "2026-07-20":"海の日","2026-08-11":"山の日","2026-09-21":"敬老の日","2026-09-22":"国民の休日","2026-09-23":"秋分の日",
  "2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日","2027-01-01":"元日","2027-01-11":"成人の日",
  "2027-02-11":"建国記念の日","2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日"
};
const SEASONS = [
  ["2026-05-02","2026-05-10","ゴールデンウィーク"],
  ["2026-08-08","2026-08-16","夏季休暇"],
  ["2026-12-26","2027-01-03","年末年始休暇"]
];
const START = new Date(2026,3,1), END = new Date(2027,2,31);
const DOW = ["日","月","火","水","木","金","土"];

// ===== Helpers =====
const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey = (y,m) => `${y}-${pad(m+1)}`;
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const inRange = d => d >= START && d <= END;
const fmt = d => `${d.getMonth()+1}月${d.getDate()}日(${DOW[d.getDay()]})`;
const fmtShort = d => `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
const diffDays = (a,b) => Math.round((b-a)/864e5);

function status(d){
  const k = key(d);
  if (!inRange(d)) return "none";
  if (PAID.has(k)) return "paid";
  if (HOLIDAY_WORK.has(k)) return "hw";
  if ((OFF[k.slice(0,7)]||[]).includes(d.getDate())) return "off";
  return "work";
}
const isRest = d => { const s = status(d); return s==="off"||s==="paid"; };
function season(d){ const k=key(d); const s=SEASONS.find(([a,b])=>k>=a&&k<=b); return s?s[2]:""; }
function noteFor(d){
  const k=key(d), st=status(d), parts=[];
  if (HOLIDAYS[k]) parts.push(HOLIDAYS[k]);
  if (st==="paid") parts.push("全社一斉に有給休暇を取る日");
  if (st==="hw") parts.push("祝日ですが出勤日");
  const s = season(d); if (s && st!=="work" && st!=="hw") parts.push(s);
  if (st==="off" && !parts.length) parts.push(d.getDay()===0||d.getDay()===6 ? "週休日" : "会社休日");
  return parts.join("・");
}
const LABEL = {work:"出勤",hw:"出勤",off:"休み",paid:"休み（有休）",none:"範囲外"};
function weekNo(d){
  const sun = addDays(d,-d.getDay());
  const base = sun >= new Date(2027,0,3) ? new Date(2027,0,3) : new Date(2025,11,28);
  return Math.floor(diffDays(base,sun)/7)+1;
}
function workDays(y,m){
  const n = new Date(y,m+1,0).getDate();
  return n - (OFF[mkey(y,m)]||[]).length; // 有休日は操業日に含む（カード記載どおり）
}

// ===== Streaks =====
const streaks = [];
for (let d=new Date(START); d<=END; d=addDays(d,1)){
  if (isRest(d) && !isRest(addDays(d,-1))){
    let e=d; while (addDays(e,1)<=END && isRest(addDays(e,1))) e=addDays(e,1);
    const len = diffDays(d,e)+1;
    if (len>=2) streaks.push({s:new Date(d),e,len});
  }
}

// ===== Today =====
const now = new Date(); const today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
function renderToday(){
  const el = document.getElementById("today");
  if (!inRange(today)){
    el.innerHTML = `<div><div class="today-label">今日</div><div class="today-date">${fmt(today)}</div></div>
      <p class="note" style="margin:0">今日はこのカレンダーの期間外です（2026年4月1日〜2027年3月31日）。</p>`;
    return;
  }
  const st = status(today);
  let nextOff=null, nextWork=null;
  for (let d=addDays(today,1); d<=END; d=addDays(d,1)){
    if (!nextOff && isRest(d)) nextOff=d;
    if (!nextWork && !isRest(d)) nextWork=d;
    if (nextOff && nextWork) break;
  }
  const nextLong = streaks.find(s=>s.len>=3 && s.e>=today && s.s>today) ;
  const cur = streaks.find(s=>s.s<=today && s.e>=today);
  const left = (a)=> { const n=diffDays(today,a); return n===1?"明日":`あと${n}日`; };
  let a, b;
  if (st==="work"||st==="hw"){
    a = nextOff ? `<div class="k">次の休み</div><div class="v">${fmt(nextOff)}</div><div class="s">${left(nextOff)}</div>` : `<div class="k">次の休み</div><div class="v">—</div>`;
  } else {
    a = nextWork ? `<div class="k">次の出勤</div><div class="v">${fmt(nextWork)}</div><div class="s">${left(nextWork)}${cur&&cur.len>=3?` ・ ${cur.len}連休中`:""}</div>` : `<div class="k">次の出勤</div><div class="v">—</div>`;
  }
  b = nextLong ? `<div class="k">次の連休</div><div class="v">${fmtShort(nextLong.s)}〜${fmtShort(nextLong.e)}</div><div class="s">${nextLong.len}連休 ・ ${left(nextLong.s)}</div>` : `<div class="k">次の連休</div><div class="v">今年度はもうありません</div>`;
  const note = noteFor(today);
  el.innerHTML = `
    <div class="today-top">
      <div><div class="today-label">今日</div><div class="today-date">${fmt(today)}</div></div>
      <span class="pill ${st}">${LABEL[st]}</span>
    </div>
    ${note?`<div class="note">${note}</div>`:""}
    <div class="next"><div>${a}</div><div>${b}</div></div>`;
}

// ===== Month view =====
let curY, curM, sel;
function clampMonth(d){ if (d<START) return new Date(START); if (d>END) return new Date(2027,2,1); return d; }
let initial = clampMonth(today);
curY = initial.getFullYear(); curM = initial.getMonth();
sel = inRange(today) ? today : new Date(curY,curM,1);
try { const v = localStorage.getItem("wc-tab"); if (v) setTimeout(()=>showTab(v),0); } catch(e){}

function renderMonth(dx){
  const grid = document.getElementById("grid");
  document.getElementById("mtitle").innerHTML = `<b>${curM+1}月</b><span>${curY}年 ・ 操業日 <span class="num">${workDays(curY,curM)}</span>日</span>`;
  document.getElementById("prev").disabled = (curY===2026&&curM===3);
  document.getElementById("next").disabled = (curY===2027&&curM===2);
  let h = DOW.map((w,i)=>`<div class="dow ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")+`<div class="dow">週</div>`;
  const first = new Date(curY,curM,1), last = new Date(curY,curM+1,0);
  let d = addDays(first,-first.getDay());
  while (d<=last){
    for (let i=0;i<7;i++){
      const day = addDays(d,i);
      if (day.getMonth()!==curM){ h+=`<span class="day empty"></span>`; continue; }
      const st=status(day), k=key(day);
      const cls=["day",st==="work"?"":st, k===key(today)?"today":"", sel&&k===key(sel)?"sel":""].join(" ");
      h+=`<button class="${cls}" data-k="${k}" aria-label="${fmt(day)} ${LABEL[st]}">${day.getDate()}</button>`;
    }
    h+=`<div class="wk"><i class="num">${weekNo(d)}</i></div>`;
    d=addDays(d,7);
  }
  grid.innerHTML=h;
  if (dx){ grid.classList.remove("slide"); void grid.offsetWidth; grid.style.setProperty("--dx",dx+"px"); grid.classList.add("slide"); }
  renderDetail();
}
function renderDetail(){
  const el=document.getElementById("detail");
  if (!sel || sel.getMonth()!==curM){ el.innerHTML=`<span class="n">日付をタップすると、出勤か休みかを表示します。</span>`; return; }
  const st=status(sel), note=noteFor(sel);
  el.innerHTML=`<div><div class="d">${fmt(sel)}</div><div class="n">第<span class="num">${weekNo(sel)}</span>週${note?" ・ "+note:""}</div></div><span class="pill ${st}">${LABEL[st]}</span>`;
}
function move(n){
  const d=new Date(curY,curM+n,1);
  if (d<new Date(2026,3,1)||d>new Date(2027,2,1)) return;
  curY=d.getFullYear(); curM=d.getMonth(); renderMonth(n>0?24:-24);
}
document.getElementById("prev").onclick=()=>move(-1);
document.getElementById("next").onclick=()=>move(1);
document.getElementById("grid").addEventListener("click",e=>{
  const b=e.target.closest("button.day[data-k]"); if(!b) return;
  const [y,m,dd]=b.dataset.k.split("-").map(Number); sel=new Date(y,m-1,dd); renderMonth();
  const nb=document.querySelector(`button.day[data-k="${b.dataset.k}"]`); if(nb) nb.focus({preventScroll:true});
});
let tx=null,ty=null;
const g=document.getElementById("grid");
g.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
g.addEventListener("touchend",e=>{ if(tx===null)return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) move(dx<0?1:-1); tx=null; },{passive:true});
document.addEventListener("keydown",e=>{ if(document.getElementById("view-month").hidden) return;
  if(e.key==="ArrowLeft"&&!e.target.closest(".day")) move(-1); if(e.key==="ArrowRight"&&!e.target.closest(".day")) move(1); });

// ===== Year view =====
function renderYear(){
  let h="";
  for (let i=0;i<12;i++){
    const y=i<9?2026:2027, m=(3+i)%12, first=new Date(y,m,1), n=new Date(y,m+1,0).getDate();
    let cells="".padStart(0); for(let j=0;j<first.getDay();j++) cells+="<i></i>";
    for(let dd=1;dd<=n;dd++){ const d=new Date(y,m,dd), st=status(d);
      cells+=`<i class="${st==="work"?"":st} ${key(d)===key(today)?"today":""}">${dd}</i>`; }
    h+=`<button class="mini" data-y="${y}" data-m="${m}"><div class="h"><b>${m+1}月</b><span>操業 ${workDays(y,m)}日</span></div><div class="mg">${cells}</div></button>`;
  }
  document.getElementById("year").innerHTML=h;
}
document.getElementById("year").addEventListener("click",e=>{
  const b=e.target.closest(".mini"); if(!b)return; curY=+b.dataset.y; curM=+b.dataset.m; showTab("month"); renderMonth();
});

// ===== Lists =====
function renderLists(){
  document.getElementById("streaks").innerHTML = streaks.filter(s=>s.len>=3).map(s=>{
    const names=[...new Set([season(s.s),season(s.e)].filter(Boolean))];
    const paid=[]; for(let d=s.s;d<=s.e;d=addDays(d,1)) if(PAID.has(key(d))) paid.push(fmtShort(d));
    const hol=[]; for(let d=s.s;d<=s.e;d=addDays(d,1)) if(HOLIDAYS[key(d)]) hol.push(HOLIDAYS[key(d)]);
    const sub=[...names, ...(names.length?[]:hol.slice(0,1)), paid.length?`${paid.join("・")}は一斉有休`:""].filter(Boolean).join(" ・ ");
    return `<li class="${s.e<today?"past":""}"><div><div class="t">${fmtShort(s.s)} 〜 ${fmtShort(s.e)}</div>${sub?`<div class="sub">${sub}</div>`:""}</div><span class="badge ${s.len>=5?"big":""}">${s.len}連休</span></li>`;
  }).join("");
  document.getElementById("hwork").innerHTML=[...HOLIDAY_WORK].sort().map(k=>{
    const [y,m,dd]=k.split("-").map(Number), d=new Date(y,m-1,dd);
    return `<li class="${d<today?"past":""}"><div><div class="t">${fmt(d)}</div><div class="sub">${HOLIDAYS[k]||""}</div></div><span class="badge w">出勤</span></li>`;
  }).join("");
  let w=0,o=0,p=0; for(let d=new Date(START);d<=END;d=addDays(d,1)){const s=status(d); if(s==="off")o++; else if(s==="paid")p++; else w++;}
  document.getElementById("stats").innerHTML=`<div><b>${w}</b><span>出勤日</span></div><div><b>${o}</b><span>休日</span></div><div><b>${p}</b><span>一斉有休</span></div>`;
}

// ===== Tabs =====
function showTab(t){
  for (const n of ["month","year","list"]){
    document.getElementById("tab-"+n).setAttribute("aria-selected", n===t);
    document.getElementById("view-"+n).hidden = n!==t;
  }
  try{ localStorage.setItem("wc-tab",t); }catch(e){}
}
for (const n of ["month","year","list"]) document.getElementById("tab-"+n).onclick=()=>showTab(n);

renderToday(); renderMonth(); renderYear(); renderLists();
})();
// ---- ホーム画面に追加（PWA） ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
(function () {
  const box = document.getElementById("install");
  const steps = document.getElementById("install-steps");
  const btn = document.getElementById("install-btn");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let dismissed = false;
  try { dismissed = localStorage.getItem("wc-install-dismissed") === "1"; } catch (e) {}
  if (standalone || dismissed) return;
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
    steps.innerHTML = "<ol><li>Safari で開く</li><li>画面下の共有ボタン（□に↑）をタップ</li><li>「ホーム画面に追加」→「追加」</li></ol>";
  } else {
    steps.innerHTML = "<ol><li>ブラウザのメニュー（︙）を開く</li><li>「ホーム画面に追加」または「アプリをインストール」を選ぶ</li></ol>";
  }
  box.hidden = false;
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener("click", async () => {
    if (!deferred) return;
    deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; btn.hidden = true;
  });
  window.addEventListener("appinstalled", () => { box.hidden = true; });
  document.getElementById("install-close").addEventListener("click", () => {
    box.hidden = true;
    try { localStorage.setItem("wc-install-dismissed", "1"); } catch (e) {}
  });
})();
</script>
